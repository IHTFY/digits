<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicons/apple-touch-icon.png"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicons/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicons/favicon.ico" sizes="48x48" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicons/favicon-16x16.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link
			rel="mask-icon"
			href="%sveltekit.assets%/favicons/safari-pinned-tab.svg"
			color="#1095c1"
		/>
		<meta name="theme-color" content="#1095c1" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// Apply a stored theme before the first paint; the app takes over once it starts.
			try {
				var theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch (error) {
				/* Without storage the page keeps its default theme. */
			}
		</script>
		<style>
			/* Installed-app launch: the first paint copies Chrome's launch screen (manifest background,
			   maskable icon at 128px), then launchExit() animates out of it. Chrome places the name from
			   the bottom of the whole screen rather than of this page, so its own crossfade fades it. */
			#launch {
				display: none;
			}
			.launching #launch {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
			}
			#launch-fill {
				position: absolute;
				inset: 0;
				background: #1095c1;
			}
			/* The maskable icon draws the hash at 84 of its 128 px. */
			#launch-icon {
				position: relative;
				width: 128px;
				height: 128px;
				padding: 22px;
				color: #fff;
			}
		</style>
		<script>
			// Plays once per fresh launch of the installed app: never in a browser tab, on reload, or on return.
			(() => {
				const root = document.documentElement;
				try {
					const nav = performance.getEntriesByType('navigation')[0];
					// The manifest asks for standalone; a browser tab in F11 full screen reports fullscreen.
					const app = matchMedia('(display-mode: standalone)').matches;
					if (!app || nav?.type !== 'navigate' || sessionStorage.getItem('launched')) return;
					sessionStorage.setItem('launched', '1');
				} catch {
					return;
				}
				root.classList.add('launching');
				const ended = new AbortController();
				const end = () => {
					clearTimeout(fallback);
					ended.abort();
					root.classList.remove('launching');
					document.getElementById('launch')?.remove();
				};
				// The exit's Web Animations, once launchExit has started them.
				let animations = [];
				// A tap before the exit starts is remembered, and the exit then skips straight to its end.
				let skipped = false;
				const skip = () => {
					skipped = true;
					animations.forEach((a) => a.finish());
				};
				// While the copy shows, a tap or key only skips it: nothing behind it reacts.
				const swallow = (event) => {
					event.preventDefault();
					event.stopImmediatePropagation();
					// A touch's click comes after the copy is gone, aimed at whatever is under the finger.
					if (event.type === 'pointerdown' && event.isPrimary && event.button === 0) {
						const { pointerId } = event;
						let timer;
						const spare = () => {
							clearTimeout(timer);
							removeEventListener('click', eat, true);
							removeEventListener('pointerup', lifted, true);
						};
						// A long hold stays covered: the wait for a click starts at this touch's release.
						const lifted = (up) => {
							if (up.pointerId === pointerId) timer = setTimeout(spare, 1000);
						};
						addEventListener('click', eat, true);
						addEventListener('pointerup', lifted, true);
						// Some browsers send no click once the copy is gone; then the next press is a new tap.
						for (const type of ['pointercancel', 'pointerdown']) {
							addEventListener(type, spare, { capture: true, once: true });
						}
					}
					skip();
				};
				const eat = (event) => {
					// A key or a screen reader clicks with no pointer behind it (detail 0): that is new input.
					if (!event.detail) return;
					removeEventListener('click', eat, true);
					event.preventDefault();
					event.stopImmediatePropagation();
				};
				// Armed with the launching state, so a press made while the page loads is covered too.
				const during = { capture: true, signal: ended.signal };
				addEventListener('pointerdown', swallow, during);
				addEventListener('keydown', swallow, during);
				// The game never stays hidden behind the copy if it fails to call launchExit, or the
				// exit fails to start.
				const fallback = setTimeout(end, 4000);
				// play(overlay) starts the game's exit and returns its Web Animations.
				window.launchExit = (play) => {
					const overlay = document.getElementById('launch');
					// Too late: the fallback already removed the copy.
					if (!overlay) return;
					if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
						try {
							animations = play(overlay);
						} catch {
							animations = [];
						}
					}
					if (!animations.length) {
						animations = [
							overlay.animate(
								{ opacity: [1, 0] },
								{ duration: 200, easing: 'ease-out', fill: 'forwards' }
							)
						];
					}
					if (skipped) skip();
					// A turned phone moves the board away from where the animation was aimed.
					screen.orientation?.addEventListener('change', skip, {
						once: true,
						signal: ended.signal
					});
					Promise.all(animations.map((a) => a.finished)).then(end, end);
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="launch" aria-hidden="true">
			<div id="launch-fill"></div>
			<svg id="launch-icon" viewBox="0 0 24 24">
				<path
					d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
				/>
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
